spring.config.import=optional:file:../.env[.properties]
spring.application.name=triagem-chamados
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/triagem_chamados}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.jpa.show-sql=true
evolution.enabled=${EVOLUTION_ENABLED:false}
evolution.base-url=${EVOLUTION_API_URL:http://localhost:8081}
evolution.instance=${EVOLUTION_INSTANCE:}
evolution.api-key=${EVOLUTION_API_KEY:}
evolution.webhook-token=${EVOLUTION_WEBHOOK_TOKEN:}
evolution.connect-timeout=${EVOLUTION_CONNECT_TIMEOUT:3s}
evolution.read-timeout=${EVOLUTION_READ_TIMEOUT:8s}
evolution.worker-delay-ms=${EVOLUTION_WORKER_DELAY_MS:1000}
evolution.worker-enabled=${EVOLUTION_WORKER_ENABLED:true}
evolution.managed=${EVOLUTION_MANAGED:false}
evolution.webhook-url=${EVOLUTION_WEBHOOK_URL:}
evolution.provision-delay-ms=${EVOLUTION_PROVISION_DELAY_MS:30000}
spring.task.scheduling.pool.size=2
